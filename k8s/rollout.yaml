apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: task-api
  namespace: task-api
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: task-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: task-api
          image: ghcr.io/OWNER/REPOSITORY:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
  strategy:
    canary:
      stableService: task-api-stable
      canaryService: task-api-canary
      trafficRouting:
        nginx:
          stableIngress: task-api
      steps:
        - setWeight: 10
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: task-api-error-rate
        - setWeight: 30
        - pause: {duration: 60s}
        - analysis:
            templates:
              - templateName: task-api-error-rate
        - setWeight: 60
        - pause: {duration: 60s}
        - setWeight: 100
      rollbackWindow:
        revisions: 3
