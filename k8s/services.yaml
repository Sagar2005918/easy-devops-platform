apiVersion: v1
kind: ServiceAccount
metadata:
  name: task-api
  namespace: task-api
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: task-api-stable
  namespace: task-api
  labels:
    app: task-api
spec:
  selector:
    app: task-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: task-api-canary
  namespace: task-api
  labels:
    app: task-api
spec:
  selector:
    app: task-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: task-api
  namespace: task-api
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["task-api.example.com"]
      secretName: task-api-tls
  rules:
    - host: task-api.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-api-stable
                port:
                  number: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: task-api
  namespace: task-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: task-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-api-ingress
  namespace: task-api
spec:
  podSelector:
    matchLabels:
      app: task-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
